{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<section class="wrap" style="max-width:440px">
  <div class="card card-pad-lg center">
    <div style="font-size:2.4rem">📬</div>
    <h1 style="font-size:1.4rem">Check your inbox</h1>
    <p class="muted">If that address has an account, a reset link is on its way.</p>
    <a class="btn" href="{% url 'accounts:login' %}">Back to sign in</a>
  </div>
</section>
{% endblock %}
