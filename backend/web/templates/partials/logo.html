{% comment %}
The PotholeWatch mark: a road surface with a broken hole in it, inside a
rounded badge. Drawn rather than an emoji so it stays crisp at 26px, works in
both themes, and can carry the brand gradient.

`size` defaults to 34.
{% endcomment %}
<svg class="logo-mark" width="{{ size|default:34 }}" height="{{ size|default:34 }}"
     viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-hidden="true">
  <defs>
    <linearGradient id="pw-badge" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#9D6BFF"/>
    </linearGradient>
    <radialGradient id="pw-pit" cx="0.5" cy="0.38" r="0.72">
      <stop stop-color="#05060A"/>
      <stop offset="1" stop-color="#14141C"/>
    </radialGradient>
  </defs>

  <rect x="0.9" y="0.9" width="38.2" height="38.2" rx="11.5"
        fill="url(#pw-badge)"/>

  {# Road surface: two lane edges receding to the horizon. #}
  <path d="M6 33.5 L15.5 12 H24.5 L34 33.5" stroke="#fff" stroke-opacity="0.28"
        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  {# Centre dashes. #}
  <path d="M20 14.5v3M20 21v3.2" stroke="#fff" stroke-opacity="0.5"
        stroke-width="1.7" stroke-linecap="round"/>

  {# The pothole: an irregular pit, not a circle, with a lit upper rim. #}
  <path d="M13.2 28.9c-1.5-2.1.5-4.6 3.4-5.3 2.6-.6 6 .1 8.3 1.4 2.6 1.5 3.3 3.8 1.2 5.2-2.1 1.4-6.1 1.8-9 1.2-2-.4-3.3-1.3-3.9-2.5Z"
        fill="url(#pw-pit)"/>
  <path d="M13.2 28.9c-1.5-2.1.5-4.6 3.4-5.3 2.6-.6 6 .1 8.3 1.4 2.6 1.5 3.3 3.8 1.2 5.2-2.1 1.4-6.1 1.8-9 1.2-2-.4-3.3-1.3-3.9-2.5Z"
        stroke="#0A0A10" stroke-opacity="0.85" stroke-width="1.1"/>
  <path d="M14.4 26.4c1.2-1.4 3.6-2 6-1.8" stroke="#fff" stroke-opacity="0.45"
        stroke-width="1.15" stroke-linecap="round"/>
</svg>
