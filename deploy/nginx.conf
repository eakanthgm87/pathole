upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Uploads are capped at 8 MB in the app; allow a little headroom so the
    # app returns a clean validation error instead of nginx closing the socket.
    client_max_body_size 12M;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live-video frames are small but inference is CPU-bound; do not cut
        # the connection while a frame is being analysed.
        proxy_read_timeout 120s;
    }
}
